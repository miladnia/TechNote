[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pytechnote"
dynamic = ["version"]
authors = [
    { name = "Milad Nia", email = "miladniaa@gmail.com" },
]
license = "MIT"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "Flask==3.0.3",
    "gunicorn==23.0.0",
    "pypandoc-binary==1.14",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest", "bumpver"]

[project.urls]
Homepage = "https://github.com/miladnia/technote"

[project.scripts]
technote = "technote.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "technote.__version__" }

[tool.setuptools.packages.find]
include = ["technote", "technote.*"]

[tool.setuptools]
include-package-data = true

[tool.bumpver]
current_version = "0.2.1"
version_pattern = "MAJOR.MINOR.PATCH[.TAG[NUM]]"
commit_message  = "release {new_version}"
commit          = true
tag             = true
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"']
"technote/__init__.py" = ["{version}"]
